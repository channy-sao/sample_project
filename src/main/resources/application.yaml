server:
  port: 8080
spring:
  application:
    name: sample_project
  logging:
    file:
      name: ./logs/sample_project.log
    logback:
      rollingPolicy:
        max-file-size: 50MB
        max-history: 7
        file-name-pattern: ${logging.file.name}.%d{yyyy-MM-dd}.%i.log
    level:
      web: info
      root: info

  datasource:
    url: jdbc:postgresql://localhost:5432/sample_project
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # Options: none, validate, update, create, create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  servlet:
    multipart:
      enabled: true
      max-file-size: "10MB"
      max-request-size: "50MB"

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
  api-docs:
    enabled: true


app:
  jwt:
    secret-key: "a3f8c9b2e1d045f78a2b4c6d8e0f1a3b5c7d9e1f2a4b6c8d0e2f4a6b8c0d2e4f"
    access-token-expiration: "900000000"
